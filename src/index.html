<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TooDoo</title>

    <!-- Font per il titolo -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=BBH+Bartle&display=swap" rel="stylesheet">

    <!-- Font per altro testo -->
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="modalAddTask.css">

    <script src="dragDrop.js" defer></script>
    <script type="module" src="script.js"></script>
</head>

<body>
    <header>
        <div class="header-left">
            <h1>TooDoo</h1>
        </div>
        <div class="header-right">
            <span class="header-author">Derkach Oleksandr 5AI</span>
        </div>
    </header>
    <div class="board">
        <div class="board-controls">
            <button id="clear-board-btn" class="clear-board-btn">Eliminare tutto</button>
            <button id="open-modal-btn" class="add-task-btn">+ Aggiungere attività</button>
            <div class="total-counter">Totale attività: <span id="total-tasks-count">0</span></div>
        </div>

        <div id="task-modal" class="modal">
            <div class="modal-content">
                <h2>Nuova attività</h2>
                <form id="task-form">
                    <div class="form-group">
                        <label for="modal-title">Titolo</label>
                        <input type="text" id="modal-title" required placeholder="Titolo dell'attività...">
                    </div>

                    <div class="form-group">
                        <label for="modal-desc">Descrizione</label>
                        <textarea id="modal-desc" placeholder="Descrivi i dettagli..."></textarea>
                    </div>

                    <div class="form-group">
                        <label for="modal-column">Colonna</label>
                        <select id="modal-column">
                            <option value="da-fare">Da Fare</option>
                            <option value="in-corso">In Corso</option>
                            <option value="fatto">Fatto</option>
                        </select>
                    </div>

                    <div class="modal-actions">
                        <button type="button" id="close-modal-btn" class="btn-secondary">Annulla</button>
                        <button type="submit" class="btn-primary">Aggiungi</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="colonne">
            <div class="colonna" id="da-fare">
                <h3 class="heading">Da Fare</h3>
            </div>
            <div class="colonna" id="in-corso">
                <h3 class="heading">In Corso</h3>
            </div>
            <div class="colonna" id="fatto">
                <h3 class="heading">Fatto</h3>
            </div>
        </div>
    </div>
</body>

</html>
